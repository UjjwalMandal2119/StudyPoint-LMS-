apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studypoint-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: studypoint.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studypoint-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: studypoint-backend
                port:
                  number: 8080
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: studypoint-backend
                port:
                  number: 8080