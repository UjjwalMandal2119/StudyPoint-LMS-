apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: studypoint-dev
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: studypoint-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: studypoint-frontend
    patch:
      - op: replace
        path: /spec/replicas
        value: 1
configMapGenerator:
  - name: studypoint-config
    behavior: merge
    literals:
      SPRING_PROFILES_ACTIVE: "dev"