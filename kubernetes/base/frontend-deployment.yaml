apiVersion: apps/v1
kind: Deployment
metadata:
  name: studypoint-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studypoint-frontend
  template:
    metadata:
      labels:
        app: studypoint-frontend
    spec:
      containers:
        - name: frontend
          image: studypoint/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10